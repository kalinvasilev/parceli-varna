# Every morning: refresh the "Ново" feed (ЧСИ public sales + ПУП registers of АГУП Варна) and republish the site.
name: Търгове ЧСИ

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 07:00 Bulgarian summer time (06:00 in winter)
  workflow_dispatch:       # "Run workflow" button for a manual update

permissions:
  contents: write
  pages: write

concurrency:
  group: auctions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read new sales
        run: python tools/bcpea.py data/auctions.json

      - name: Read ПУП registers
        run: python tools/agup.py data/pup.json

      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "parceli-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json data/pup.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Данни: обновяване $(date -u +%F)"
          git push
          # Pushes made with the workflow token don't always start a Pages build, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
